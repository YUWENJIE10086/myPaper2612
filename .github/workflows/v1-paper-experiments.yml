name: v1-paper-experiments
on:
  push:
    paths:
      - '.github/workflows/v1-paper-experiments.yml'
      - '1118/papers/v1/code/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific and DOCX dependencies
        run: python -m pip install -q numpy pandas scipy scikit-learn matplotlib xlrd python-docx
      - name: Run REAL SOURCE XLS audit and pilot tests
        run: python 1118/papers/v1/code/01_run_real_experiments.py
      - name: Create journal paper DOCX after verified metrics
        run: |
          if test -f 1118/papers/v1/code/02_build_paper.py; then
            python 1118/papers/v1/code/02_build_paper.py
          fi
      - name: Commit aggregate results, figures, and paper (NO RAW DATA)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1118/papers/v1/results/*.json 1118/papers/v1/results/*.csv 1118/papers/v1/figures/*.png 1118/papers/v1/figures/*.svg 1118/papers/v1/*.docx 1118/papers/v1/*.md 1118/papers/v1/*.html || true
          git diff --cached --quiet || (git commit -m "paper v1: real-data experiments, charts and journal DOCX" && git push)
